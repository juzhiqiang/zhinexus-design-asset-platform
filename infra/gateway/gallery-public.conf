# Public ingress for the Zhinexus design-asset platform.
#
# Serves exactly two hostnames:
#   * the public gallery origin            -> apps/gallery            (127.0.0.1:5173)
#   * the ONE public API origin            -> apps/api                (127.0.0.1:3000)
#
# The API origin is deliberately singular. `access/oidc.ts` pins the web redirect URI to
# `<api origin>/v1/auth/oidc/callback`, and the session cookie is `__Host-platform`, which is
# scoped to the exact host that issued it. A second API hostname would therefore mint a second,
# disconnected cookie jar and silently break web login. Internal-only capability is exposed as
# PATHS on this same hostname and gated by trusted source network, never as a second hostname.
#
# Path allowlisting alone is not enough, so this edge also enforces:
#   * method policy per path — public reads are GET/HEAD/OPTIONS only, and
#     POST /v1/variant-releases/:id/compatibility (a maintainer write) needs a trusted source
#   * a query-string policy — `?revision=...` on the login and CLI routes is an
#     administrator-gated candidate-configuration pointer and is never public
#   * a traversal check that looks only at the path before `?`, so legitimate `?path=docs%2F...`
#     material queries and OIDC `code` / `iss` values are not refused
#
# Replacement checklist before use (an unfinished edit fails closed, see the `geo` default):
#   1. both `server_name` values            -> the reviewed registered hostnames
#   2. both certificate/key paths           -> the reviewed TLS material
#   3. `$public_api_trusted_network` CIDRs  -> the reviewed office/VPN egress ranges
#   4. `limit_req` rates                    -> values agreed with operations
# The preview gateway keeps its own reviewed templates (preview.conf / preview-ip.conf); this
# file intentionally contains no route to 127.0.0.1:3001 so no unreviewed path to preview exists.
# The two Next.js locations deliberately have no method restriction: App Router Server Actions
# are POSTs and must keep working.

# Access and error logs never record the query string: the public API edge sees OIDC
# `code`/`state` and preview `grant` tokens in it. Upstream error pages can echo the original
# request URI, so error logging is disabled here rather than scrubbed later.
log_format frontend_edge_safe '$remote_addr $request_method $host $uri $status';
log_format api_edge_safe '$remote_addr $request_method $host $uri $status';

# Credential-bearing endpoints share one zone so a single source cannot drive them faster.
limit_req_zone $binary_remote_addr zone=public_edge_auth:10m rate=5r/s;

upstream gallery_public { server 127.0.0.1:5173; }
upstream api_public { server 127.0.0.1:3000; }

# --- Path traversal, path only ---------------------------------------------------------------
# `$request_uri` carries the query string, which legitimately contains percent-encoded slashes
# (`?path=docs%2Fline-vue.md`) and OIDC `code` / `iss` values. Split the path off first, then
# check only that part: encoded traversal, NUL, backslash and empty segments never belong in a
# path here. The allowlist regexes below are additionally charset-constrained, so a
# double-encoded segment simply fails to match.
map $request_uri $public_ingress_path {
    default "";
    "~^(?<public_path>[^?]*)" $public_path;
}
map $public_ingress_path $public_ingress_unsafe_uri {
    default 0;
    ~*(?:[.][.]|%2e|%2f|%5c|%00|\x5c)  1;
    ~(?://)                        1;
}

# REPLACE with the reviewed internal/VPN egress CIDRs. `default 0` denies every other source,
# and the placeholder below is an RFC5737 documentation range, so an unedited template exposes
# nothing. Both this file and admin-internal.conf must carry the same list.
geo $public_api_trusted_network {
    default 0;
    203.0.113.0/24 1;   # zhinexus-REPLACE: office/VPN egress (placeholder, unroutable)
}

# --- Query-string policy for the login surface ------------------------------------------------
# `$args` is the raw, undecoded query string, so a percent-encoded or duplicated parameter name
# cannot sneak past these literal keys. Anything not listed falls through to `deny`.

# Login scope. Only an unparameterised start or the explicit gallery target is public.
# `target=admin` is an internal console entry and is additionally limited to a trusted source.
# A `revision` pointer — the legacy candidate-configuration entry point — is never public.
map $args $public_edge_start_scope {
    default          deny;
    ""               public;
    ~^target=gallery$ public;
    ~^target=admin$   internal;
}
map "$public_api_trusted_network$public_edge_start_scope" $public_edge_start_decision {
    default     deny;
    "0public"   allow;
    "1public"   allow;
    "1internal" allow;
}

# The callback consumes the state the server bound to the attempt. Only the four OIDC response
# keys are ever legitimate here; a `revision` or `target` on the callback is refused outright.
map $args $public_edge_callback_args {
    default deny;
    "~^(?:(?:code|state|iss|session_state)=[^&]*&?){1,4}$" allow;
}

# Endpoints that take no query string at all. The API already schema-rejects unknown catalog
# query parameters, so no edge policy is needed for `framework` / `page` / `pageSize` /
# `query` / `category`.
map $args $public_edge_no_query {
    default    has_query;
    ""         none;
}

# --- Method policy ----------------------------------------------------------------------------
# `/v1/variant-releases/:id/compatibility` is the one allowlisted path with two meanings: a
# public GET and a maintainer POST. The composite key keeps the write behind a trusted source
# while the read stays public. Every other allowlisted path gets `limit_except` below.
map "$request_method:$public_api_trusted_network" $public_edge_compatibility_method {
    default       deny;
    "GET:0"       allow;
    "GET:1"       allow;
    "HEAD:0"     allow;
    "HEAD:1"     allow;
    "OPTIONS:0"  allow;
    "OPTIONS:1"  allow;
    "POST:1"     allow;
}

# Reject handshakes for any hostname this ingress does not serve.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# ----------------------------------------------------------------------------------------------
# Public gallery origin. Serves the Next.js gallery only; it is never an API or admin entry.
# ----------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name assets.example.com;   # zhinexus-REPLACE: public gallery hostname

    ssl_certificate /run/secrets/gallery-fullchain.pem;   # zhinexus-REPLACE
    ssl_certificate_key /run/secrets/gallery-key.pem;     # zhinexus-REPLACE
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/gallery-access.log frontend_edge_safe;
    error_log /dev/null;

    # Shared by every location in this server: no location below redefines a proxy header, so
    # the client-supplied forwarding headers are always overwritten, never appended.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_read_timeout 30s;

    # The API, the identity service and the metrics endpoint live on the API origin only.
    # Answering 404 here keeps the public gallery host from ever becoming a second API entry.
    location = /v1 { return 404; }
    location /v1/ { return 404; }
    location /identity/ { return 404; }
    location /internal/ { return 404; }
    # The admin console is not published on the public edge at all.
    location /admin { return 404; }
    location /admin/ { return 404; }

    location / {
        proxy_pass http://gallery_public;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ----------------------------------------------------------------------------------------------
# The one public API origin. Everything under /v1/ is denied unless it appears below.
# ----------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.assets.example.com;   # zhinexus-REPLACE: the single public API hostname

    ssl_certificate /run/secrets/gallery-fullchain.pem;   # zhinexus-REPLACE
    ssl_certificate_key /run/secrets/gallery-key.pem;     # zhinexus-REPLACE
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/api-access.log api_edge_safe;
    error_log /dev/null;
    client_max_body_size 8m;

    if ($public_ingress_unsafe_uri) { return 400; }

    # Shared by every proxied location in this server.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_read_timeout 60s;

    # --- Internal-only surface, on the same hostname, gated by trusted source network --------
    # Reachable only from a reviewed internal/VPN source. The public gallery origin can never
    # satisfy this, so "admin writes are internal-only" holds even though the hostname is public.
    # Authentication still applies afterwards; this is a network boundary, not an authorization
    # bypass. Every one of these paths is a write, an administration or an internal-only read.
    location ~ ^/v1/(?:releases|uploads|baselines|search|matching|access-settings|managed-accounts|categories|publishing)(?:/|$) {
        if ($public_api_trusted_network = 0) { return 403; }
        proxy_pass http://api_public;
    }
    # POST /v1/variant-releases/:id/deprecate — maintainer-only deprecation.
    location ~ "^/v1/variant-releases/[0-9a-fA-F-]{36}/deprecate$" {
        if ($public_api_trusted_network = 0) { return 403; }
        proxy_pass http://api_public;
    }
    # Candidate access-settings verification is administrator-only and must only ever be
    # initiated from the internal console. The public callback still consumes a bound state.
    location ~ ^/v1/auth/oidc/candidate(?:-start|-cli)?$ {
        if ($public_api_trusted_network = 0) { return 403; }
        limit_req zone=public_edge_auth burst=5 nodelay;
        proxy_pass http://api_public;
    }
    # CLI login metadata. The gallery never calls it, so it is not published: it is reachable
    # only from a trusted source, which also keeps `?revision=` candidate pointers internal.
    # If remote CLI login is ever required, add a dedicated public location deliberately.
    location = /v1/auth/oidc/cli {
        if ($public_api_trusted_network = 0) { return 403; }
        limit_req zone=public_edge_auth burst=5 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://api_public;
    }
    # Operational metrics carry their own credential at the API; never publish them.
    location /internal/ {
        if ($public_api_trusted_network = 0) { return 403; }
        proxy_pass http://api_public;
    }

    # --- Public allowlist: browsing, login and preview only ------------------------------------
    # Compatibility is listed BEFORE the general variant read below: the general regex must not
    # swallow this path, because its POST is a maintainer write that needs a trusted source.
    location ~ "^/v1/(?:me/)?variant-releases/[0-9a-fA-F-]{36}/compatibility$" {
        if ($public_edge_compatibility_method != "allow") { return 403; }
        limit_except GET HEAD OPTIONS POST { deny all; }
        proxy_pass http://api_public;
    }
    # Unauthenticated reads. `catalog_can_read(component, NULL)` returns public components only.
    location = /healthz { limit_except GET HEAD OPTIONS { deny all; } proxy_pass http://api_public; }
    location = /v1/components { limit_except GET HEAD OPTIONS { deny all; } proxy_pass http://api_public; }
    # The logged-in private catalogue the gallery's `/library` route reads. `/v1/me/*` requires a
    # valid identity plus the reader role and an explicit `component_permissions` grant, so
    # exposing it publicly is safe: an anonymous caller gets 401, a granted caller gets only what
    # `catalog_can_read` allows.
    location = /v1/me/components { limit_except GET HEAD OPTIONS { deny all; } proxy_pass http://api_public; }
    # Variant reads: /v1/variants/:id/releases/:version[/artifacts|/reports] and
    # /v1/variant-releases/:releaseId[/artifacts|/reports], plus the same shapes under /v1/me/.
    location ~ "^/v1/(?:me/)?variant(?:-releases/[0-9a-fA-F-]{36}|s/[A-Za-z0-9._-]{1,128}/releases/[0-9A-Za-z._+-]{1,128})(?:/artifacts|/reports)?$" {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://api_public;
    }
    # Preview grants: the public gallery detail page embeds the isolated preview. Public Ready
    # components allow anonymous grants via `preview_can_read(id, NULL)`; private components require
    # a valid identity and `preview_can_read(id, subject)`; the gateway still filters cookies and bearer tokens.
    location = /v1/preview-grants {
        limit_req zone=public_edge_auth burst=10 nodelay;
        limit_except POST OPTIONS { deny all; }
        if ($public_edge_no_query = has_query) { return 400; }
        proxy_pass http://api_public;
    }
    # Login entry. Unparameterised, `target=gallery` (public), or `target=admin` from a trusted
    # source. The API binds the target to the attempt server-side and never trusts a
    # browser-supplied return URL, so this only decides who may ask for which target.
    location = /v1/auth/oidc/start {
        limit_req zone=public_edge_auth burst=10 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }
        if ($public_edge_start_decision != "allow") { return 403; }
        proxy_pass http://api_public;
    }
    # Callback: public by necessity (the API pins this URL), but only the four OIDC response
    # keys may appear, and the server only honours the state it bound to the attempt.
    location = /v1/auth/oidc/callback {
        limit_req zone=public_edge_auth burst=10 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }
        if ($public_edge_callback_args != "allow") { return 400; }
        proxy_pass http://api_public;
    }
    # Session probe: unauthenticated by design, no secrets returned, no parameters.
    location = /v1/auth/oidc/session {
        limit_except GET HEAD OPTIONS { deny all; }
        if ($public_edge_no_query = has_query) { return 400; }
        proxy_pass http://api_public;
    }
    # Logout only deletes the caller's own server-side session row; the Origin check in the API
    # is the CSRF control and it fails closed when the header is absent.
    location = /v1/auth/oidc/logout {
        limit_req zone=public_edge_auth burst=10 nodelay;
        limit_except POST OPTIONS { deny all; }
        if ($public_edge_no_query = has_query) { return 400; }
        proxy_pass http://api_public;
    }

    # --- Default deny --------------------------------------------------------------------------
    # A separate local identity service is outside this split. Its routes are not exposed by
    # this template; deploying that service requires its own reviewed ingress and tests.
    location /identity/ { return 404; }
    location /v1/ { return 404; }
    location / { return 404; }
}
