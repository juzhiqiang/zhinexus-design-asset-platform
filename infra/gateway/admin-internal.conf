# Internal ingress for the Zhinexus design-asset platform.
#
# Serves two hostnames, both on an internal-only listener:
#   * the admin console origin -> apps/admin (127.0.0.1:5177)
#   * the SAME API hostname as gallery-public.conf -> apps/api (127.0.0.1:3000)
#
# Why the API hostname is repeated here instead of inventing an internal one: the session cookie
# is `__Host-platform`, scoped to the exact host that issued it, and the API pins the web
# redirect URI to `<api origin>/v1/auth/oidc/callback`. A distinct internal API hostname would
# issue a second, disconnected cookie jar and web login would break for internal users. So the
# internal entry is the SAME hostname reached over an internal path (split-horizon DNS or an
# internal VIP on 443), and it simply allows the full API surface.
#
# Deployment requirements:
#   * bind this listener to an internal interface only; never publish it to the internet
#   * use port 443 on the internal VIP, NOT a different port: a different port is a different
#     origin for CORS and would be rejected by the API's precise origin allowlist
#   * the admin console must use the public API hostname as its API base URL so the one cookie
#     jar is shared; see docs/guides/gallery-admin-deployment.md
#
# Replacement checklist (an unfinished edit fails closed, see the `geo` default):
#   1. both `server_name` values           -> the reviewed hostnames; the API one MUST equal the
#                                            `server_name` used by gallery-public.conf
#   2. both certificate/key paths          -> the reviewed TLS material
#   3. `$internal_edge_trusted_network`    -> the same CIDRs as gallery-public.conf
#   4. the `listen` address                -> the internal interface / VIP
#
# No method restriction is applied here: this edge is network-gated, the API validates methods
# itself, and the admin console is a Next.js app whose Server Actions are POSTs.

log_format internal_edge_safe '$remote_addr $request_method $host $uri $status';

upstream admin_internal { server 127.0.0.1:5177; }
upstream api_internal { server 127.0.0.1:3000; }

# Path only, exactly as on the public edge: `$request_uri` includes the query string, which
# legitimately carries percent-encoded material paths and OIDC values.
map $request_uri $internal_ingress_path {
    default "";
    "~^(?<internal_path>[^?]*)" $internal_path;
}
map $internal_ingress_path $internal_ingress_unsafe_uri {
    default 0;
    ~*(?:[.][.]|%2e|%2f|%5c|%00|\x5c)  1;
    ~(?://)                        1;
}

# REPLACE with the reviewed internal/VPN egress CIDRs; keep them identical to
# `$public_api_trusted_network` in gallery-public.conf. `default 0` denies every other source,
# and the placeholder below is an RFC5737 documentation range, so an unedited template exposes
# nothing. The whole listener is gated by this, so a missing edit denies the console too.
geo $internal_edge_trusted_network {
    default 0;
    203.0.113.0/24 1;   # zhinexus-REPLACE: office/VPN egress (placeholder, unroutable)
}

# If a TLS-terminating load balancer sits in front, ONLY it may supply the client address.
# Uncomment and list its addresses; without this, $remote_addr is the peer and a client-supplied
# X-Forwarded-For can never influence the ACL above.
# set_real_ip_from 198.51.100.0/24;      # zhinexus-REPLACE: trusted proxy addresses
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# Reject handshakes for any hostname this ingress does not serve.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

# ----------------------------------------------------------------------------------------------
# The same API hostname, internal path. Full surface, still network-gated and still authenticated.
# ----------------------------------------------------------------------------------------------
server {
    listen 8443 ssl;
    server_name api.assets.example.com;   # zhinexus-REPLACE: MUST match gallery-public.conf

    ssl_certificate /run/secrets/admin-fullchain.pem;   # zhinexus-REPLACE
    ssl_certificate_key /run/secrets/admin-key.pem;     # zhinexus-REPLACE
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/internal-api-access.log internal_edge_safe;
    error_log /dev/null;
    client_max_body_size 8m;

    if ($internal_edge_trusted_network = 0) { return 403; }
    if ($internal_ingress_unsafe_uri) { return 400; }

    # Shared by every location in this server: client-supplied forwarding headers are always
    # overwritten, never appended.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://api_internal;
    }
}

# ----------------------------------------------------------------------------------------------
# The admin console origin. Serves the Next.js admin app only.
#
# It deliberately does NOT proxy /v1/, /identity/ or /internal/. Proxying them here would make
# the admin origin a second API entry with its own cookie jar, which breaks the pinned OIDC
# callback and the `__Host-` cookie. The admin app calls the API hostname directly instead.
# ----------------------------------------------------------------------------------------------
server {
    listen 8443 ssl;
    server_name admin.assets.example.com;   # zhinexus-REPLACE: internal admin hostname

    ssl_certificate /run/secrets/admin-fullchain.pem;   # zhinexus-REPLACE
    ssl_certificate_key /run/secrets/admin-key.pem;     # zhinexus-REPLACE
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/admin-access.log internal_edge_safe;
    error_log /dev/null;

    if ($internal_edge_trusted_network = 0) { return 403; }
    if ($internal_ingress_unsafe_uri) { return 400; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_read_timeout 30s;

    location = /v1 { return 404; }
    location /v1/ { return 404; }
    location /identity/ { return 404; }
    location /internal/ { return 404; }

    location / {
        proxy_pass http://admin_internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
