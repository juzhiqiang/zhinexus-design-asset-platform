# Deployment template; provide real independent registered domains and wildcard TLS.
# This log format deliberately excludes query strings, Cookie and Authorization.
log_format preview_safe '$remote_addr $request_method $host $uri $status';
# Forward exactly one valid preview cookie; platform cookies and Bearer tokens never cross ingress.
map $http_cookie $duplicate_preview_cookie {
    default 0;
    "~(?:^|;)[ ]*__Host-preview=[^;]*(?:;[^;]*)*;[ ]*__Host-preview=" 1;
}
map "$duplicate_preview_cookie:$http_cookie" $preview_session_cookie {
    default "";
    "~^0:(?:[^;]*;[ ]*)*__Host-preview=([A-Za-z0-9_-]{43})(?:;[^;]*)*$" "__Host-preview=$1";
}
map $uri $preview_forward_cookie {
    default $preview_session_cookie;
    /access-probe "";
}
upstream preview_service { server 127.0.0.1:3001; }
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name "~^r-[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}\.preview\.company-assets\.net$";
    ssl_certificate /run/secrets/preview-fullchain.pem;
    ssl_certificate_key /run/secrets/preview-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/preview-access.log preview_safe;
    # Nginx upstream error messages can include the original URL with a bootstrap token.
    error_log /dev/null;
    location / {
        proxy_pass http://preview_service;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $preview_forward_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 20s;
    }
}
