# Opt-in IP and port preview ingress. Match the dedicated port to PLATFORM_PREVIEW_ORIGIN.
# Supply a trusted certificate whose subject alternative name includes the public IPv4 address.
upstream preview_ip_service { server 127.0.0.1:3001; }
server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate /run/secrets/preview-ip-fullchain.pem;
    ssl_certificate_key /run/secrets/preview-ip-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The bootstrap query and asset path carry short-lived preview credentials.
    access_log off;
    error_log /dev/null;

    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Set-Cookie;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_read_timeout 20s;

    location = /bootstrap { proxy_pass http://preview_ip_service; }
    location ^~ /_preview/ { proxy_pass http://preview_ip_service; }
    location / { return 404; }
}
